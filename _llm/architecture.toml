[meta]
name = "hamma"
repo = "forkwright/hamma"
generated = false
source_docs = [
  "README.md",
  "CLAUDE.md",
  "Cargo.toml",
  "https://github.com/forkwright/kanon/blob/main/projects/hamma/STATE.md",
]

[architecture]
summary = "Clean-room Rust mesh networking stack targeting Tailscale compatibility, starting with the dictyon client and shared mitos types."
layers = [
  "core-types",
  "client",
  "control-protocol",
  "wireguard-data-plane",
  "derp",
  "dns",
  "coordination-server",
]

[[architecture.crates]]
name = "mitos"
path = "crates/mitos"
role = "Shared WireGuard key types, peer identity types, behavioral configuration, and protocol constants. Noise framing lives in dictyon."

[[architecture.crates]]
name = "dictyon"
path = "crates/dictyon"
role = "Peer client: Noise-framed control protocol, registration, map streaming, and planned gated WireGuard data plane."

[[architecture.crates]]
name = "histos"
path = "crates/histos"
status = "planned"
role = "Planned coordination server replacing tailscale.com when sovereignty is wanted. Path does not exist yet."

[[architecture.crates]]
name = "hamma-derp"
path = "crates/hamma-derp"
status = "planned"
role = "Planned optional DERP relay server. Path does not exist yet."

[[interfaces]]
name = "dictyon client"
kind = "lib"
path = "crates/dictyon"
