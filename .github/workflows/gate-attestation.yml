# WHY: the public Phase A contract must participate in the existing required
# `gate / gate` context on every pull request, including a tip carrying a
# Gate-Passed trailer. A prerequisite job would make the reusable call skip on
# failure, leaving the required context without a terminal failure. The local
# reusable owns an always-run terminal aggregator under the same `gate` job id,
# so branch protection needs no mutation.
#
# Shared trailer verification, docs-only classification, attribution policy,
# and full-build fallback remain centralized in forkwright/.github's hybrid
# gate. Hamma's wrapper adds only its producer-contract check and aggregation.
name: Gate Attestation

on:
  pull_request:
    branches: [main]
  # WHY: merged main must be built as its own tree; a pre-merge trailer attests
  # a different tree after squash, rebase, or intervening merges.
  push:
    branches: [main]

permissions:
  contents: read

# WHY no caller concurrency: the shared hybrid gate owns the repo/ref-scoped
# group. Repeating it here can make a reusable call cancel itself.
jobs:
  gate:
    uses: ./.github/workflows/phase-a-gate.yml
    secrets: inherit
