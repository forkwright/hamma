# archetype: B
# forge-only: false
# spdx: MIT OR Apache-2.0

# Forge CI pipeline for forkwright/hamma.
#
# Prepends the public Phase A contract check to the hardcoded default Rust
# gate (fmt → check → clippy → nextest → lint), then pins per-stage build and
# test concurrency to 8. Without this
# cap, cargo defaults to num_cpus (64 on this Threadripper) and parallel
# rustc + nextest processes peak well over 100GB of RSS — enough to OOM
# menos when any other fleet work is running. 8 is the budget that keeps
# a single CI run under ~25GB peak, low enough that serial drains don't
# OOM even with aletheia.service and the dispatch fleet resident.
#
# Keep in sync with `crates/archeion/src/ci_config.rs::default_rust_gate`
# when the upstream default changes — only the `--jobs` / `--test-threads`
# flags should differ.

[pipeline]
stages = ["phase-a contract", "cargo fmt", "cargo check", "cargo clippy", "cargo nextest", "kanon lint"]

[stages."phase-a contract"]
cmd = "producer_boundary=\"$(git merge-base HEAD origin/main)\" && test -n \"$producer_boundary\" && HAMMA_PRODUCER_BOUNDARY=\"$producer_boundary\" python3 -B tools/render_phase_a.py --check && python3 -B -m unittest tools/test_render_phase_a.py tools/test_phase_a_workflow.py"
timeout_secs = 60

[stages."cargo fmt"]
cmd = "cargo fmt --all -- --check"
timeout_secs = 300

[stages."cargo check"]
cmd = "cargo check --workspace --all-targets --jobs 8"
timeout_secs = 900

[stages."cargo clippy"]
cmd = "cargo clippy --workspace --all-targets --jobs 8 -- -D warnings"
timeout_secs = 900

[stages."cargo nextest"]
cmd = "cargo nextest run --workspace --build-jobs 8 --test-threads 8"
timeout_secs = 1800

[stages."kanon lint"]
cmd = "kanon lint . --summary"
timeout_secs = 600
